name: CI

# 工程质量规范（路线图 §7）：CI = ruff + mypy + pytest，PR 全绿
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: ruff + mypy + pytest（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装依赖
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: 类型检查
        run: mypy src tests
      - name: 单测
        # 失败时把输出转成 check-run 注解，便于远程排障
        run: |
          pytest tests/unit -q -x --tb=short 2>&1 | sed 's/^/::error::/'
          exit ${PIPESTATUS[0]}
